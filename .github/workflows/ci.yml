name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design:
    name: Design system
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # DESIGN.md section 11, gate 1 — every contrast pair recomputed from the tokens.
      - name: Verify contrast
        run: node build/verify-contrast.mjs

      # Generated files must match their source. Catches a hand-edited tokens.css
      # or a stale palette table in DESIGN.md.
      - name: Check generated files are current
        run: node build/gen-tokens.mjs --check

      # Every icon must map to an SF Symbol, a GTK name and sprite geometry.
      - name: Check icons are current
        run: node build/gen-icons.mjs --check

      # The committed app-icon PNGs must have been rendered from the current mark and palette.
      # Needs no browser: it compares the masters and the render stamp, not pixels.
      - name: Check app icon is current
        run: node build/gen-app-icon.mjs --check

      # DESIGN.md section 11, gate 2 — no raw colour or type literals in UI source.
      - name: Token lint
        run: node build/lint-tokens.mjs

      # The vendor checks compare wwwroot/lib against node_modules, which a fresh checkout does not
      # have. Build-time tooling only — nothing installed here ships.
      - name: Install build tooling
        run: npm ci

      - name: Vendored Tabulator is current
        run: node build/vendor-tabulator.mjs --check

      - name: Vendored ansi_up is current
        run: node build/vendor-ansi.mjs --check

      # Rebundles with esbuild and compares; the Compose schema is checked against its pinned hash
      # without fetching anything.
      - name: Vendored monaco-yaml and Compose schema are current
        run: node build/vendor-monaco-yaml.mjs --check

      - name: Vendored composerize is current
        run: node build/vendor-composerize.mjs --check

  build:
    name: Build (${{ matrix.name }})
    needs: design
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-26
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Each app head needs its platform's workloads, and builds as a no-op on the other two OSes
      # (build/SkipHeadOnOtherOS.targets), which is what lets every runner build one solution.
      - name: Install workloads (macOS)
        if: runner.os == 'macOS'
        run: dotnet workload install maui macos

      - name: Install workloads (Windows)
        if: runner.os == 'Windows'
        run: dotnet workload install maui-windows

      # Generated sources are gitignored, so they must be produced before build.
      - name: Generate tokens and icons
        run: |
          node build/gen-tokens.mjs
          node build/gen-icons.mjs

      # Restored for the configuration it is built in. The app heads choose their runtime
      # identifiers by configuration (a Release macOS build is universal, a Windows one is
      # RID-specific), and an assets file restored for Debug has no targets for those.
      - name: Restore
        run: dotnet restore -p:Configuration=Release

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.name }}
          path: '**/*.trx'
          if-no-files-found: ignore
