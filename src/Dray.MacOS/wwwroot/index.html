<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Dray</title>
    <base href="/" />
    <link rel="icon" href="data:," />

    <!-- Everything is local. No CDN, no webfont: the app must render with the network
         unplugged, and a strict WebView CSP would block it anyway. -->
    <link rel="stylesheet" href="_content/Dray.Ui/css/app.css" />
    <!-- Blazor bundles every .razor.css in the app and its RCLs into one file named after the
         host project. -->
    <link rel="stylesheet" href="Dray.MacOS.styles.css" />

    <style>
        /* The WKWebView is transparent so the native window colour shows through; the host
           replaces --bg with the resolved NSColor before first paint. A background here would
           paint over the very thing that makes the seam invisible. */
        html, body {
            background: transparent;
        }

    </style>
</head>
<body>
    <div id="app"></div>

    <!-- Blazor's own unhandled-error element, restyled. Its id is fixed by the framework; the
         content is ours, because "An unhandled error has occurred" is the wrong register for a
         desktop app and says nothing a user can act on. -->
    <div id="blazor-error-ui" role="alert" aria-live="assertive">
        <div class="overlay-card">
            <p class="overlay-title">Dray needs to restart</p>
            <p class="overlay-body">
                Something went wrong that Dray could not recover from. Your containers are
                unaffected &mdash; nothing here changes what is running on the engine.
            </p>
            <!-- Behind a disclosure: a stack trace is what makes this diagnosable in a WebView
                 with no devtools, and also the thing that turns a calm message into an alarming
                 one. The script below reveals the <details> only when there is something in it. -->
            <details id="dray-error-details">
                <summary>Technical details</summary>
                <pre id="dray-error-detail"></pre>
            </details>

            <a class="overlay-action reload" href=".">Restart Dray</a>
        </div>
    </div>

    <script>
        // A WebView has no devtools by default, so an unhandled error otherwise reads as a bare
        // "something went wrong" with the actual cause only in a console nobody can open.
        // Debug-only detail, shown in place.
        (function () {
            var detail = document.getElementById('dray-error-detail');
            var disclosure = document.getElementById('dray-error-details');
            function show(text) {
                if (!detail || !disclosure) return;
                detail.textContent = String(text).slice(0, 4000);
                disclosure.style.display = 'block';
            }
            window.addEventListener('error', function (e) {
                show((e.error && (e.error.stack || e.error.message)) || e.message);
            });
            window.addEventListener('unhandledrejection', function (e) {
                var r = e.reason;
                show((r && (r.stack || r.message)) || r);
            });
        })();
    </script>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>
</html>
