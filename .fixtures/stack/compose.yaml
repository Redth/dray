# A small stack Dray is developed against. Deliberately idle — see the memory note about not
# leaving load-generating containers running.
name: draydemo

services:
  web:
    image: nginx:alpine
    ports:
      - "8099:80"
    depends_on:
      - cache

    # Here so Dray's watch control has something real to be enabled by. Sync only — no rebuild —
    # so nothing here burns CPU when a file changes.
    develop:
      watch:
        - action: sync
          path: ./site
          target: /usr/share/nginx/html

  cache:
    image: redis:7-alpine
    command: ["redis-server", "--save", ""]

  worker:
    image: alpine:latest
    command: ["sh", "-c", "while true; do sleep 30; done"]
    depends_on:
      - cache
